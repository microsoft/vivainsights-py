# Catalogue of primary vivainsights workflows.
#
# This file is the single source of truth for function discovery. The task guide
# and the agent-readable llms.txt are generated from it by
# tools/generate_discovery.py, and CI fails if the generated files drift.
#
# Column guidance:
#   required_columns  fixed person-query fields that must be present.
#   selected_columns  caller-supplied roles. Metric and organizational
#                     attribute names vary by query, product version, and
#                     language locale, so they are named by role, not by value.
schema_version: 1
package: vivainsights
language: python
r:
  package: vivainsights
  repository: https://github.com/microsoft/vivainsights
  documentation: https://microsoft.github.io/vivainsights/
parity_vocabulary:
  - aligned
  - partial
  - r_only
  - python_only
  - planned
  - language_native
workflows:
  - id: import-query
    task: Import a Viva Insights query export
    intents:
      - load a Viva Insights CSV export
      - read a person query into Python
      - start an analysis from an exported query
    python_function: import_query
    input_grain: Viva Insights CSV export
    required_columns: []
    selected_columns: []
    privacy: Import applies no disclosure thresholds; validate and aggregate before sharing results.
    returns: DataFrame with cleaned column names
    return_types: []
    example: vi.import_query("query.csv")
    runnable: false
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.import_query.html
    related: [check_query, extract_hr, extract_date_range]
    r_function: import_query
    parity: partial

  - id: validate-query
    task: Validate a loaded query before analysis
    intents:
      - check whether my query is valid
      - run data validation on a person query
      - sanity check a Viva Insights dataset
    python_function: check_query
    input_grain: Person-period query
    required_columns: [PersonId, MetricDate]
    selected_columns: []
    privacy: Validation reports population counts; review before sharing externally.
    returns: Printed message or descriptive text
    return_types: [message, text]
    example: vi.check_query(vi.load_pq_data(), return_type="text")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.check_query.html
    related: [hrvar_count_all, extract_hr, extract_date_range, identify_datefreq]
    r_function: check_query
    parity: partial

  - id: inspect-organizational-attributes
    task: Summarize organizational attributes and their data quality
    intents:
      - list the HR attributes in my data
      - check missing values in organizational attributes
      - see how many distinct values each attribute has
    python_function: hrvar_count_all
    input_grain: Person-period query
    required_columns: []
    selected_columns: [hrvar_list]
    privacy: Distinct-value counts can be small; apply disclosure policy before sharing.
    returns: Summary DataFrame of attributes, distinct values, and missing counts
    return_types: []
    example: vi.hrvar_count_all(vi.load_pq_data())
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.hrvar_count.html
    related: [hrvar_count, extract_hr, check_query]
    r_function: hrvar_count_all
    parity: partial

  - id: count-population-by-group
    task: Count distinct people in each group
    intents:
      - how many employees are in each organization
      - count headcount by HR attribute
      - check group sizes before analysis
    python_function: hrvar_count
    input_grain: Person-period query
    required_columns: [PersonId]
    selected_columns: [hrvar]
    privacy: Small groups may be identifying; apply disclosure policy before sharing.
    returns: Bar chart or summary table of distinct people per group
    return_types: [plot, table]
    example: vi.hrvar_count(vi.load_pq_data(), hrvar="Organization", return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.hrvar_count.html
    related: [hrvar_count_all, totals_col, create_bar]
    r_function: hrvar_count
    parity: partial

  - id: compare-groups
    task: Compare the average of a metric across groups
    intents:
      - compare organizations on a metric
      - plot average collaboration by HR attribute
      - summarize group averages
    python_function: create_bar
    input_grain: Person-period query
    required_columns: [PersonId]
    selected_columns: [metric, hrvar]
    privacy: Groups with fewer than mingroup distinct people are excluded.
    returns: Bar chart or summary table
    return_types: [plot, table]
    example: vi.create_bar(vi.load_pq_data(), metric="Emails_sent", hrvar="Organization", return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_bar.html
    related: [create_boxplot, create_rank, create_bubble, create_bar_asis]
    r_function: create_bar
    parity: partial

  - id: compare-distributions
    task: Compare the distribution of a metric across groups
    intents:
      - show the spread of a metric by group
      - compare medians and outliers across organizations
      - create a boxplot by HR attribute
    python_function: create_boxplot
    input_grain: Person-period query
    required_columns: [PersonId, MetricDate]
    selected_columns: [metric, hrvar]
    privacy: Groups with fewer than mingroup distinct people are excluded.
    returns: Boxplot, summary table, or person-level data
    return_types: [plot, table, data]
    example: vi.create_boxplot(vi.load_pq_data(), metric="Emails_sent", hrvar="Organization", return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_boxplot.html
    related: [create_bar, create_lorenz, create_inc]
    r_function: create_boxplot
    parity: partial

  - id: rank-groups
    task: Rank groups on a metric
    intents:
      - which groups are highest and lowest on a metric
      - rank organizations by collaboration
      - find top and bottom groups
    python_function: create_rank
    input_grain: Person-period query
    required_columns: [PersonId]
    selected_columns: [metric, hrvar]
    privacy: Groups with fewer than mingroup distinct people are excluded.
    returns: Ranked plot or table
    return_types: [plot, table]
    example: vi.create_rank(vi.load_pq_data(), metric="Emails_sent", hrvar="Organization", return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_rank.html
    related: [create_bar, keymetrics_scan]
    r_function: create_rank
    parity: partial

  - id: trend-over-time
    task: Track a metric over time by group
    intents:
      - show a metric trend over time
      - plot weekly collaboration by organization
      - has this metric changed over time
    python_function: create_line
    input_grain: Person-period query
    required_columns: [PersonId, MetricDate]
    selected_columns: [metric, hrvar]
    privacy: Groups with fewer than mingroup distinct people are excluded.
    returns: Line chart or summary table
    return_types: [plot, table]
    example: vi.create_line(vi.load_pq_data(), metric="Emails_sent", hrvar="Organization", return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_line.html
    related: [create_trend, keymetrics_scan]
    r_function: create_line
    parity: partial

  - id: weekly-pattern-heatmap
    task: Show week-by-week patterns for a metric
    intents:
      - create a heatmap of weekly activity
      - show how a metric varies week by week
      - visualize seasonality by group
    python_function: create_trend
    input_grain: Person-period query
    required_columns: [PersonId, MetricDate]
    selected_columns: [metric, hrvar]
    privacy: Groups with fewer than mingroup distinct people are excluded.
    returns: Heatmap or summary table
    return_types: [plot, table]
    example: vi.create_trend(vi.load_pq_data(), metric="Emails_sent", hrvar="Organization", return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_trend.html
    related: [create_line, identify_outlier]
    r_function: create_trend
    parity: partial

  - id: scan-key-metrics
    task: Scan several metrics across groups at once
    intents:
      - compare many metrics by organization
      - build a key metrics overview
      - scan a scorecard of metrics
    python_function: keymetrics_scan
    input_grain: Person-period query
    required_columns: [PersonId]
    selected_columns: [metrics, hrvar]
    privacy: Groups with fewer than mingroup distinct people are excluded.
    returns: Heatmap or summary table of metrics by group
    return_types: [plot, table]
    example: vi.keymetrics_scan(vi.load_pq_data(), hrvar="Organization", metrics=["Emails_sent", "Collaboration_hours"], return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.keymetrics_scan.html
    related: [create_rank, create_radar, create_bar]
    r_function: keymetrics_scan
    parity: partial

  - id: compare-two-metrics
    task: Compare two metrics across groups
    intents:
      - plot one metric against another by group
      - show the relationship between two metrics
      - create a bubble chart of groups
    python_function: create_bubble
    input_grain: Person-period query
    required_columns: [PersonId]
    selected_columns: [metric_x, metric_y, hrvar]
    privacy: Groups with fewer than mingroup distinct people are excluded.
    returns: Bubble chart or summary table
    return_types: [plot, table]
    example: vi.create_bubble(vi.load_pq_data(), metric_x="Emails_sent", metric_y="Collaboration_hours", hrvar="Organization", return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_bubble.html
    related: [create_bar, create_boxplot, xicor]
    r_function: create_bubble
    parity: partial

  - id: multi-metric-profile
    task: Profile groups across several metrics on one chart
    intents:
      - create a radar chart comparing groups
      - show a multi-metric profile by organization
      - compare groups on several metrics at once
    python_function: create_radar
    input_grain: Person-period query
    required_columns: [PersonId]
    selected_columns: [metrics, hrvar]
    privacy: Groups with fewer than mingroup distinct people are excluded.
    returns: Radar chart or indexed summary table
    return_types: [plot, table]
    example: vi.create_radar(vi.load_pq_data(), metrics=["Emails_sent", "Collaboration_hours"], hrvar="Organization", return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_radar.html
    related: [keymetrics_scan, create_rank]
    r_function: create_radar
    parity: partial

  - id: threshold-incidence
    task: Measure how many people fall above or below a threshold
    intents:
      - what proportion of people exceed a threshold
      - show incidence above a metric value
      - compare threshold rates across groups
    python_function: create_inc
    input_grain: Person-period query
    required_columns: [PersonId]
    selected_columns: [metric, hrvar, threshold, position]
    privacy: Groups with fewer than mingroup distinct people are excluded.
    returns: Incidence plot, summary table, or underlying data
    return_types: [plot, table, data]
    example: vi.create_inc(vi.load_pq_data(), metric="Emails_sent", hrvar="Organization", threshold=20, position="above", return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_inc.html
    related: [create_bar, create_boxplot, create_lorenz]
    r_function: create_inc
    parity: partial

  - id: concentration-inequality
    task: Measure how concentrated a metric is across the population
    intents:
      - calculate a Gini coefficient
      - plot a Lorenz curve
      - is this metric concentrated in a few people
    python_function: create_lorenz
    input_grain: Person-period query
    required_columns: [PersonId]
    selected_columns: [metric]
    privacy: Curves describe the whole population; apply disclosure policy before sharing.
    returns: Lorenz curve, summary table, or Gini coefficient
    return_types: [plot, table, gini]
    example: vi.create_lorenz(vi.load_pq_data(), metric="Emails_sent", return_type="gini")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_lorenz.html
    related: [create_inc, create_boxplot]
    r_function: create_lorenz
    parity: partial

  - id: plot-precomputed-table
    task: Plot a summary table that is already aggregated
    intents:
      - plot a table I already calculated
      - create a bar chart without re-aggregating
      - visualize a precomputed summary
    python_function: create_bar_asis
    input_grain: Pre-aggregated summary table
    required_columns: []
    selected_columns: [group_var, bar_var]
    privacy: Apply disclosure thresholds when computing the summary table.
    returns: Bar chart figure
    return_types: []
    example: vi.create_bar_asis(vi.create_bar(vi.load_pq_data(), metric="Emails_sent", hrvar="Organization", return_type="table"), group_var="Organization", bar_var="metric")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_bar_asis.html
    related: [create_bar, export]
    r_function: create_bar_asis
    parity: partial

  - id: flow-between-states
    task: Visualize movement between two categorical states
    intents:
      - show how people move between segments
      - create a Sankey chart of transitions
      - visualize flows between categories
    python_function: create_sankey
    input_grain: Two-column count table
    required_columns: []
    selected_columns: [var1, var2, count]
    privacy: Small flows may be identifying; apply disclosure policy before sharing.
    returns: Plotly Sankey figure
    return_types: []
    example: vi.create_sankey(transitions, var1="UsageSegments_previous", var2="UsageSegments", count="n")
    runnable: false
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_sankey.html
    related: [identify_usage_segments, network_p2p]
    r_function: create_sankey
    parity: partial

  - id: drivers-information-value
    task: Rank predictors of a binary outcome
    intents:
      - which metrics predict an outcome
      - calculate information value
      - find drivers of a binary flag
    python_function: create_IV
    input_grain: Person-period query with a binary outcome column
    required_columns: [PersonId]
    selected_columns: [predictors, outcome]
    privacy: Outcome flags can be sensitive; apply disclosure policy before sharing.
    returns: Plot, summary table, information value scores, or a list of outputs
    return_types: [plot, summary, IV, list, plot-WOE]
    example: vi.create_IV(data, predictors=["Emails_sent", "Collaboration_hours"], outcome="IsHighUsage", return_type="summary")
    runnable: false
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_IV.html
    related: [create_odds_ratios, xicor]
    r_function: create_IV
    parity: partial

  - id: odds-ratios
    task: Calculate odds ratios for an outcome
    intents:
      - calculate odds ratios
      - how much more likely is an outcome
      - quantify the effect of ordinal metrics
    python_function: create_odds_ratios
    input_grain: Person-period query with a binary outcome column
    required_columns: [PersonId]
    selected_columns: [ord_metrics, metric]
    privacy: Outcome flags can be sensitive; apply disclosure policy before sharing.
    returns: Odds ratio table or plot
    return_types: [table, plot]
    example: vi.create_odds_ratios(data, ord_metrics=["Emails_sent"], metric="IsHighUsage", return_type="table")
    runnable: false
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_odds_ratios.html
    related: [create_IV, xicor]
    r_function: create_odds_ratios
    parity: partial

  - id: rank-correlation
    task: Measure association between two metrics
    intents:
      - correlate two metrics
      - measure dependence between variables
      - calculate the Chatterjee coefficient
    python_function: xicor
    input_grain: Two numeric series
    required_columns: []
    selected_columns: [x, y]
    privacy: Correlations are population level; apply disclosure policy before sharing.
    returns: Correlation coefficient
    return_types: []
    example: vi.xicor(vi.load_pq_data()["Emails_sent"], vi.load_pq_data()["Collaboration_hours"])
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.xicor.html
    related: [create_IV, create_bubble]
    r_function: xicor
    parity: partial

  - id: prepare-survival-data
    task: Reshape a person query for survival analysis
    intents:
      - prepare data for survival analysis
      - build time and event columns
      - convert a panel query to person-level survival format
    python_function: create_survival_prep
    input_grain: Person-period query
    required_columns: [PersonId, MetricDate]
    selected_columns: [metric, event_condition, hrvar]
    privacy: Person-level survival data is identifying; aggregate before sharing.
    returns: Person-level DataFrame with time and event columns
    return_types: []
    example: vi.create_survival_prep(vi.load_pq_data(), metric="Emails_sent")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_survival_prep.html
    related: [create_survival, identify_churn]
    r_function: create_survival_prep
    parity: partial

  - id: survival-analysis
    task: Estimate time until an event occurs
    intents:
      - run a survival analysis
      - plot Kaplan-Meier curves
      - how long until people adopt a behaviour
    python_function: create_survival
    input_grain: Person-level survival table
    required_columns: [PersonId]
    selected_columns: [time_col, event_col, hrvar]
    privacy: Groups with fewer than mingroup distinct people are excluded.
    returns: Survival curve plot or survival table
    return_types: [plot, table]
    example: vi.create_survival(surv_data, time_col="time", event_col="event", hrvar="Organization", return_type="table")
    runnable: false
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.create_survival.html
    related: [create_survival_prep, identify_churn]
    r_function: create_survival
    parity: partial

  - id: usage-segments
    task: Segment people by how consistently they use a behaviour
    intents:
