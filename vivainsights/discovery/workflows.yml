    returns: Classified data, stacked bar chart, or summary table
    return_types: [data, plot, table]
    example: vi.identify_usage_segments(vi.load_pq_data(), metric="Emails_sent", version="12w", return_type="table")
    runnable: true
    documentation: https://microsoft.github.io/vivainsights-py/_api/vivainsights.identify_usage_segments.html
    related: [identify_habit, create_sankey]
    r_function: identify_usage_segments
    parity: partial

